    coil_currents: zero
    ip_scale: 500000.0
  reference_source:
    kind: t15_synthetic_follow
    preset: t15_real_replay_like
    seed: 11
    duration_s: 1.0
    t_step: 0.001
    target_update_s: 0.20
    theta_count: 512
    ip:
      kind: segmented
      seed: 101
      min: 112947.0
      max: 414434.0
      segment_min_steps: 50
