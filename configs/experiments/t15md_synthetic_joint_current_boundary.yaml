name: t15md_synthetic_joint_current_boundary
sim:
  config_path: ../tokamak-sim/configs/T15MD_new_data.toml
  initial_currents_path: null
  initial_state:
    ip: 0.0
    coil_currents: zero
    ip_scale: 500000.0
  reference_source:
    kind: t15_synthetic_follow
    seed: 11
    duration_s: 1.0
    t_step: 0.001
    target_update_s: 0.20
    theta_count: 512
    ip:
      kind: template_dir
      path: ../tokamak-sim/data/t15_data_new/ip
      seed: 101
      amplitude_jitter: 0.05
      duration_jitter: 0.05
      shape_jitter: 0.02
      start: 0.0
  angles: 32
  max_episode_steps: 1000
  realism_enabled: true
  resample_references_on_reset: true
  termination:
    terminate_on_boundary_loss: true
    boundary_loss_grace_steps: 50
    terminate_on_nonfinite_observation: true
    terminate_on_nonfinite_reward: true
    current_limit_margin_min: null
    derivative_limit_margin_min: null
    measured_boundary_missing_steps: null
reward_config: ../rewards/joint_current_boundary.yaml
randomization_config: ../randomization/conservative.yaml
evaluation:
  deterministic: true
  episodes: 1
training:
  enabled: false
  note: synthetic reference source integration is now explicit; scale training remains staged
