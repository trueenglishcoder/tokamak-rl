name: t15md_training_circle_static_boundary
sim:
  config_path: ../tokamak-sim/configs/T15MD_new_data.toml
  initial_currents_path: null
  initial_state:
    ip: 0.0
    coil_currents: zero
    ip_scale: 500000.0
  reference_source:
    kind: t15_synthetic_follow
    preset: circle_static_boundary
    seed: 21
    duration_s: 1.0
    t_step: 0.001
    theta_count: 512
    ip:
      kind: segmented
      seed: 202
      min: 112947.0
      max: 414434.0
      segment_min_steps: 80
      segment_max_steps: 250
      segment_count_min: 3
      segment_count_max: 6
      max_steps: 1439
      rate_limit: 8000000.0
      hold_probability: 0.45
      start: 0.0
    boundary:
      kind: static_parameters
      parameters:
        R0: 1.40
        Z0: 0.0
        A0: 0.55
        kappa: 1.0
        delta: 0.0
  angles: 32
  max_episode_steps: 1000
  realism_enabled: true
  resample_references_on_reset: true
  observation:
    version: v2
    target_preview_steps: 8
    target_preview_stride: 10
  termination:
    terminate_on_boundary_loss: true
    boundary_loss_grace_steps: 50
    terminate_on_nonfinite_observation: true
    terminate_on_nonfinite_reward: true
    current_limit_margin_min: null
    derivative_limit_margin_min: null
    measured_boundary_missing_steps: null
reward_config: ../rewards/joint_current_boundary.yaml
randomization_config: ../randomization/conservative.yaml
evaluation:
  deterministic: true
  episodes: 4
  validation_seed: 9100
training:
  enabled: false
  note: simple curriculum/debug preset with static circular boundary and segmented Ip
